<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1840" viewBox="0 0 1600 1840"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a1c"/><stop offset="1" stop-color="#090e12"/></linearGradient><linearGradient id="gold"><stop stop-color="#756343"/><stop offset=".5" stop-color="#d6bd84"/><stop offset="1" stop-color="#756343"/></linearGradient></defs><rect width="1600" height="1840" fill="url(#bg)"/><rect x="30" y="30" width="1540" height="1780" rx="8" fill="none" stroke="#716349" stroke-width="2"/><rect x="43" y="43" width="1514" height="1754" rx="5" fill="none" stroke="#3e3b32"/><path d="M55 290V140Q55 80 100 58Q145 80 145 140V290" fill="none" stroke="#7f704e" stroke-width="2"/><path d="M70 270V145Q70 100 100 79Q130 100 130 145V270" fill="none" stroke="#3f4d47" stroke-width="2"/><path d="M1455 290V140Q1455 80 1500 58Q1545 80 1545 140V290" fill="none" stroke="#7f704e" stroke-width="2"/><path d="M1470 270V145Q1470 100 1500 79Q1530 100 1530 145V270" fill="none" stroke="#3f4d47" stroke-width="2"/><path d="M765 83L800 63L835 83V123L800 143L765 123Z" fill="#264334" stroke="#a4bd83" stroke-width="2"/><text x="782" y="113" fill="#d9dfbe" font-family="DejaVu Sans" font-size="27" font-weight="bold">JS</text><text x="800" y="221" text-anchor="middle" fill="#d4bd8c" font-family="DejaVu Serif" font-size="76" font-weight="bold">util.parseArgs</text><text x="800" y="280" text-anchor="middle" fill="#c4c9c5" font-family="DejaVu Sans" font-size="34">Validate the target of negation</text><rect x="100" y="324" width="1400" height="140" rx="9" fill="#172b25" stroke="#698674" stroke-width="2"/><text x="136" y="371" fill="#b8cda8" font-family="DejaVu Sans" font-size="24" font-weight="bold">THE STRICT-MODE RULE</text><text x="136" y="420" fill="#f0e9d9" font-family="DejaVu Sans" font-size="33" font-weight="bold">An applied --no-* negation must target a declared boolean.</text><text x="100" y="528" fill="#d4bd8c" font-family="DejaVu Serif" font-size="33" font-weight="bold">The failing configuration</text><rect x="100" y="550" width="1400" height="230" rx="8" fill="#131b20" stroke="#424b4d"/><text x="135" y="599" fill="#d9dce0" font-family="DejaVu Sans Mono" font-size="28" font-weight="normal">logfile: { type: 'string' },</text><text x="135" y="645" fill="#d9dce0" font-family="DejaVu Sans Mono" font-size="28" font-weight="normal">'no-logfile': { type: 'boolean', short: 'L' }</text><text x="135" y="691" fill="#d9dce0" font-family="DejaVu Sans Mono" font-size="28" font-weight="normal">args: ['--logfile', 'out.log', '--no-logfile']</text><text x="135" y="737" fill="#b4c8b8" font-family="DejaVu Sans Mono" font-size="28" font-weight="normal">allowNegative: true, strict: true</text><rect x="100" y="817" width="678" height="210" rx="8" fill="#281b1e" stroke="#865854"/><rect x="822" y="817" width="678" height="210" rx="8" fill="#14291f" stroke="#63886e"/><text x="135" y="865" fill="#dea49b" font-family="DejaVu Sans" font-size="24" font-weight="bold">BEFORE</text><text x="135" y="920" fill="#f0d0c9" font-family="DejaVu Sans Mono" font-size="31" font-weight="normal">{ logfile: false }</text><text x="135" y="977" fill="#d4b9b3" font-family="DejaVu Sans" font-size="26" font-weight="normal">A string option receives a boolean.</text><text x="857" y="865" fill="#a8d2b2" font-family="DejaVu Sans" font-size="24" font-weight="bold">AFTER</text><text x="857" y="915" fill="#dfebdc" font-family="DejaVu Sans" font-size="28" font-weight="bold">Reject before storing the value.</text><text x="857" y="966" fill="#bdd3bd" font-family="DejaVu Sans Mono" font-size="25" font-weight="normal">ERR_PARSE_ARGS_UNKNOWN_OPTION</text><text x="100" y="1090" fill="#d4bd8c" font-family="DejaVu Serif" font-size="32" font-weight="bold">What changes, and what stays compatible</text><rect x="100" y="1122" width="1400" height="86" rx="3" fill="#192227"/><path d="M818 1136V1194" stroke="#3b4543"/><text x="126" y="1174" fill="#e2e1d9" font-family="DejaVu Sans" font-size="26" font-weight="normal">String target or missing target</text><text x="846" y="1174" fill="#e0a59a" font-family="DejaVu Sans" font-size="26" font-weight="normal">Rejected in strict mode</text><rect x="100" y="1214" width="1400" height="86" rx="3" fill="#151e22"/><path d="M818 1228V1286" stroke="#3b4543"/><text x="126" y="1266" fill="#e2e1d9" font-family="DejaVu Sans" font-size="26" font-weight="normal">Boolean target + negative short alias</text><text x="846" y="1266" fill="#b4d5b8" font-family="DejaVu Sans" font-size="26" font-weight="normal">Still sets the target to false</text><rect x="100" y="1306" width="1400" height="86" rx="3" fill="#192227"/><path d="M818 1320V1378" stroke="#3b4543"/><text x="126" y="1358" fill="#e2e1d9" font-family="DejaVu Sans" font-size="26" font-weight="normal">multiple, defaults and negated tokens</text><text x="846" y="1358" fill="#b4d5b8" font-family="DejaVu Sans" font-size="26" font-weight="normal">Existing behavior preserved</text><rect x="100" y="1398" width="1400" height="86" rx="3" fill="#151e22"/><path d="M818 1412V1470" stroke="#3b4543"/><text x="126" y="1450" fill="#e2e1d9" font-family="DejaVu Sans" font-size="26" font-weight="normal">Literal no-* string with a value</text><text x="846" y="1450" fill="#b4d5b8" font-family="DejaVu Sans" font-size="26" font-weight="normal">Still stored as a literal string</text><rect x="100" y="1490" width="1400" height="86" rx="3" fill="#192227"/><path d="M818 1504V1562" stroke="#3b4543"/><text x="126" y="1542" fill="#e2e1d9" font-family="DejaVu Sans" font-size="26" font-weight="normal">strict: false / allowNegative: false</text><text x="846" y="1542" fill="#b4d5b8" font-family="DejaVu Sans" font-size="26" font-weight="normal">Existing behavior preserved</text><path d="M100 1622H1500" stroke="url(#gold)" stroke-width="2"/><text x="100" y="1680" fill="#d8c69f" font-family="DejaVu Serif" font-size="31" font-weight="bold">The fix belongs in checkOptionUsage().</text><text x="100" y="1730" fill="#b7c4be" font-family="DejaVu Sans" font-size="28" font-weight="normal">storeOption() keeps its existing negation behavior.</text><text x="100" y="1776" fill="#a99a7d" font-family="DejaVu Sans" font-size="23" font-weight="normal">Node.js PR #67086  /  issue #67085</text></svg>